  <text x="195" y="500" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#78716C">Barber Suite v4.2.0</text>
  <text x="195" y="518" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#A8A29E">by Kriakarya 2026</text>

  
  <!-- Bottom Navigation -->
