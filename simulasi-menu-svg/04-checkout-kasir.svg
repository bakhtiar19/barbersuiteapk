<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- 04 - Menu Checkout Kasir (Bottom Sheet) -->
  <defs>
    <linearGradient id="darkHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C88A4B"/>
      <stop offset="100%" stop-color="#B07236"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0D0D0D" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="390" height="844" rx="28" fill="#F5F3EF"/>

  <!-- Top Status Bar -->
  <rect x="0" y="0" width="390" height="28" fill="#0D0D0D"/>
  <text x="20" y="18" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#E7E5E4">09:41</text>
  <text x="370" y="18" text-anchor="end" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#D89B5C">100%</text>

  
  <!-- Dimmed background -->
  <rect x="0" y="28" width="390" height="816" fill="#0D0D0D" opacity="0.55"/>

  <!-- Bottom Sheet -->
  <g transform="translate(0, 124)">
    <rect width="390" height="720" rx="24" fill="#F5F3EF"/>
    <rect x="171" y="10" width="48" height="5" rx="2.5" fill="#D6D3D1"/>
    <text x="20" y="42" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#0D0D0D">Checkout</text>
    <text x="370" y="42" text-anchor="end" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#78716C">✕</text>
    <line x1="0" y1="56" x2="390" y2="56" stroke="#E7E5E4"/>

    <!-- Cart Items -->
    <text x="20" y="80" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0D0D0D">PESANAN · 2 ITEM</text>
    <rect x="16" y="90" width="358" height="104" rx="14" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="30" y="114" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0D0D0D">Haircut + Wash</text>
    <text x="30" y="130" font-family="ui-monospace, monospace" font-size="11" fill="#78716C">Rp 65.000 × 1</text>
    <text x="358" y="122" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0D0D0D">Rp 65.000</text>
    <line x1="28" y1="142" x2="360" y2="142" stroke="#F5F3EF"/>
    <text x="30" y="166" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0D0D0D">Beard Trim</text>
    <text x="30" y="182" font-family="ui-monospace, monospace" font-size="11" fill="#78716C">Rp 25.000 × 1</text>
    <text x="358" y="174" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0D0D0D">Rp 25.000</text>

    <!-- Customer Inputs -->
    <text x="20" y="218" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#57534E">Nama Pelanggan *</text>
    <rect x="284" y="205" width="90" height="18" rx="9" fill="#DCFCE7"/>
    <text x="329" y="217" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#16A34A">Pelanggan lama</text>
    <rect x="16" y="226" width="358" height="40" rx="12" fill="#FFFFFF" stroke="#C88A4B" stroke-width="1.5"/>
    <text x="28" y="251" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0D0D0D">Andi Pratama</text>

    <text x="20" y="290" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#57534E">Nomor WhatsApp (opsional)</text>
    <rect x="16" y="298" width="358" height="40" rx="12" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="28" y="323" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#0D0D0D">081234567890</text>

    <!-- Payment Method -->
    <text x="20" y="362" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#57534E">Pembayaran</text>
    <rect x="16" y="370" width="358" height="42" rx="12" fill="#E7E5E4"/>
    <text x="76" y="396" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#57534E">Tunai</text>
    <text x="195" y="396" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#57534E">Transfer</text>
    <rect x="254" y="374" width="116" height="34" rx="9" fill="#0D0D0D"/>
    <text x="312" y="396" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">QRIS</text>

    <!-- Discount & Notes -->
    <text x="20" y="438" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#B07236">Diskon &amp; catatan  ▾</text>

    <!-- Totals -->
    <line x1="16" y1="458" x2="374" y2="458" stroke="#D6D3D1" stroke-dasharray="4 4"/>
    <text x="20" y="484" font-family="Inter, sans-serif" font-size="13" fill="#57534E">Subtotal</text>
    <text x="370" y="484" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#57534E">Rp 90.000</text>
    <text x="20" y="518" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0D0D0D">Total</text>
    <text x="370" y="520" text-anchor="end" font-family="ui-monospace, monospace" font-size="22" font-weight="800" fill="#0D0D0D">Rp 90.000</text>

    <!-- Submit Button -->
    <rect x="16" y="544" width="358" height="52" rx="14" fill="#0D0D0D"/>
    <text x="195" y="575" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">SIMPAN TRANSAKSI</text>
  </g>

  
</svg>
