<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- 09 - Menu Riwayat Transaksi -->
  <defs>
    <linearGradient id="darkHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C88A4B"/>
      <stop offset="100%" stop-color="#B07236"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0D0D0D" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="390" height="844" rx="28" fill="#F5F3EF"/>

  <!-- Top Status Bar -->
  <rect x="0" y="0" width="390" height="28" fill="#0D0D0D"/>
  <text x="20" y="18" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#E7E5E4">09:41</text>
  <text x="370" y="18" text-anchor="end" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#D89B5C">100%</text>

  
  <rect x="0" y="28" width="390" height="56" fill="#F5F3EF"/>
  <line x1="0" y1="84" x2="390" y2="84" stroke="#E7E5E4"/>
  <text x="20" y="54" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#0D0D0D">←  Riwayat Transaksi</text>
  <text x="44" y="71" font-family="Inter, sans-serif" font-size="11" fill="#78716C">22 transaksi · Omzet bersih Rp 1.450.000</text>

  <!-- Search + Filters -->
  <rect x="16" y="96" width="358" height="38" rx="12" fill="#FFFFFF" stroke="#D6D3D1"/>
  <text x="28" y="119" font-family="Inter, sans-serif" font-size="12" fill="#A8A29E">🔍  Cari nomor struk atau nama pelanggan...</text>

  <g transform="translate(16, 144)">
    <rect x="0" y="0" width="70" height="28" rx="8" fill="#0D0D0D"/>
    <text x="35" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Hari Ini</text>
    <rect x="76" y="0" width="84" height="28" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="118" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#57534E">Minggu Ini</text>
    <rect x="166" y="0" width="76" height="28" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="204" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#57534E">Bulan Ini</text>
    <rect x="248" y="0" width="66" height="28" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
    <text x="281" y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#57534E">Semua</text>
  </g>

  <!-- Transaction List -->
  <g filter="url(#cardShadow)" transform="translate(16, 184)">
    <rect width="358" height="74" rx="14" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="14" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0D0D0D">Andi Pratama</text>
    <rect x="104" y="11" width="42" height="16" rx="5" fill="#F5F3EF"/>
    <text x="125" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#57534E">QRIS</text>
    <text x="14" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#78716C">TRX-20261111-0023 · 11 Nov 2026, 14:20 · Barber Dimas</text>
    <text x="14" y="58" font-family="Inter, sans-serif" font-size="11" fill="#57534E">Haircut + Wash ×1, Beard Trim ×1</text>
    <text x="344" y="42" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#0D0D0D">Rp 90.000</text>
  </g>

  <g filter="url(#cardShadow)" transform="translate(16, 268)">
    <rect width="358" height="74" rx="14" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text x="14" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0D0D0D">Budi Santoso</text>
    <rect x="102" y="11" width="42" height="16" rx="5" fill="#F5F3EF"/>
    <text x="123" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#57534E">Tunai</text>
    <text x="14" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#78716C">TRX-20261111-0022 · 11 Nov 2026, 13:45 · Barber Raka</text>
    <text x="14" y="58" font-family="Inter, sans-serif" font-size="11" fill="#57534E">Haircut + Wash ×1</text>
    <text x="344" y="42" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#0D0D0D">Rp 65.000</text>
  </g>

  <!-- Voided Transaction Example -->
  <g filter="url(#cardShadow)" transform="translate(16, 352)">
    <rect width="358" height="74" rx="14" fill="#FFFFFF" stroke="#FECACA"/>
    <text x="14" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#78716C" text-decoration="line-through">Tono Wijaya</text>
    <rect x="98" y="11" width="42" height="16" rx="5" fill="#FEE2E2"/>
    <text x="119" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#DC2626">VOID</text>
    <text x="14" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#78716C">TRX-20261111-0021 · Alasan: Salah pilih layanan</text>
    <text x="14" y="58" font-family="Inter, sans-serif" font-size="11" fill="#78716C">Haircut ×1</text>
    <text x="344" y="42" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#A8A29E" text-decoration="line-through">Rp 50.000</text>
  </g>

  
  <!-- Bottom Navigation -->
  <g transform="translate(0, 772)">
    <rect x="0" y="0" width="390" height="72" fill="#0D0D0D"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#262626" stroke-width="1"/>
    <!-- Beranda -->
    <g transform="translate(39, 16)">
      <path d="M-8,8 L0,0 L8,8 L8,18 L-8,18 Z" fill="none" stroke="#78716C" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="0" y="34" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#78716C">Beranda</text>
    </g>
    <!-- Pelanggan -->
    <g transform="translate(117, 16)">
      <circle cx="0" cy="5" r="4.5" fill="none" stroke="#78716C" stroke-width="1.8"/>
      <path d="M-9,18 C-9,13 9,13 9,18" fill="none" stroke="#78716C" stroke-width="1.8" stroke-linecap="round"/>
      <text x="0" y="34" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#78716C">Pelanggan</text>
    </g>
    <!-- Kasir Center FAB -->
    <g transform="translate(195, 2)">
      <circle cx="0" cy="6" r="24" fill="#C88A4B" stroke="#0D0D0D" stroke-width="4"/>
      <line x1="-7" y1="6" x2="7" y2="6" stroke="#0D0D0D" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="-1" x2="0" y2="13" stroke="#0D0D0D" stroke-width="2.5" stroke-linecap="round"/>
      <text x="0" y="48" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#D89B5C">Kasir</text>
    </g>
    <!-- Laporan -->
    <g transform="translate(273, 16)">
      <rect x="-8" y="8" width="4" height="10" rx="1" fill="#78716C"/>
      <rect x="-2" y="3" width="4" height="15" rx="1" fill="#78716C"/>
      <rect x="4" y="0" width="4" height="18" rx="1" fill="#78716C"/>
      <text x="0" y="34" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#78716C">Laporan</text>
    </g>
    <!-- Lainnya -->
    <g transform="translate(351, 16)">
      <line x1="-8" y1="3" x2="8" y2="3" stroke="#D89B5C" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-8" y1="9" x2="8" y2="9" stroke="#D89B5C" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-8" y1="15" x2="8" y2="15" stroke="#D89B5C" stroke-width="1.8" stroke-linecap="round"/>
      <text x="0" y="34" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#D89B5C">Lainnya</text>
    </g>
  </g>
</svg>
